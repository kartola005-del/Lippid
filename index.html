<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>lippid</title>

    <style>
        * {

        body {

            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 8px;
            margin-bottom: 55px;
        }

        .arquivos {
            display: flex;
            justify-content: center;
            gap: 65px;
        }

        .arquivo {
            color: #aaa;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .arquivo svg {
            width: 55px;
            height: 55px;
            stroke: #ddd;
            fill: none;
            stroke-width: 2;
        }

        .arquivo:active {
            opacity: 0.5;
        }

        footer {
            position: fixed;
            bottom: 22px;
            color: #555;
            font-size: 11px;
        }
    </style>
</head>

            </a>

                    <path d="m11 48 15-15 9 9 7-7 11 13"/>

</html>
